name: offchain

on:
  push:
    branches: [main]
    paths: ["offchain/**", "contracts/test/fixtures/**", ".github/workflows/offchain.yml"]
  pull_request:
    paths: ["offchain/**", "contracts/test/fixtures/**", ".github/workflows/offchain.yml"]

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offchain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: offchain/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
