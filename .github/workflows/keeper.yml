name: keeper

# Runs the keeper against the Base Sepolia test deployment every 10 minutes. Enable it by setting the repository
# variable KEEPER_ENABLED to true, with the secrets BASE_SEPOLIA_RPC_URL and KEEPER_PRIVATE_KEY (a testnet-only key
# funded with Base Sepolia ETH).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    name: Keeper pass
    if: ${{ vars.KEEPER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: offchain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: offchain/package-lock.json

      - name: Install
        run: npm ci

      # The participant list is scanned incrementally; its cache carries the scan over between runs.
      - name: Restore participant cache
        uses: actions/cache/restore@v6
        with:
          path: offchain/.cache
          key: offchain-cache-${{ github.run_id }}
          restore-keys: offchain-cache-

      - name: Run one pass
        run: npm run keeper -- --network base-sepolia
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}

      - name: Save participant cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: offchain/.cache
          key: offchain-cache-${{ github.run_id }}
