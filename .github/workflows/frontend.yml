name: frontend

# Checks the dApp on pull requests and publishes it to GitHub Pages (tenax.brmz.com.br) from main. The hourly run refreshes the
# leaderboard snapshot, which the static site serves instead of scanning events from the browser. Publishing needs
# Settings > Pages > Source set to GitHub Actions; the secret BASE_SEPOLIA_RPC_URL is optional (the public RPC is
# used without it).
on:
  push:
    branches: [main]
    paths: ["frontend/**", "deployments/**", "offchain/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "deployments/**", "offchain/src/abi/**", ".github/workflows/frontend.yml"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test and build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build:
    name: Build site
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            offchain/package-lock.json
            frontend/package-lock.json

      - name: Install off-chain tools
        run: npm ci
        working-directory: offchain

      # Shared with the keeper workflow: the participant scan resumes where the last run stopped.
      - name: Restore participant cache
        uses: actions/cache/restore@v6
        with:
          path: offchain/.cache
          key: offchain-cache-${{ github.run_id }}
          restore-keys: offchain-cache-

      - name: Snapshot the leaderboard
        run: npm run snapshot -- --network base-sepolia
        working-directory: offchain
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}

      - name: Save participant cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: offchain/.cache
          key: offchain-cache-${{ github.run_id }}

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
