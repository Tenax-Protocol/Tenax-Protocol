[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

# Heavier fuzzing in CI.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 200

[lint]
# The protocol clock is the block timestamp by design (ERC-6372, weekly locks, seasons,
# authorization windows); second-level drift has no meaningful effect on any of them.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
