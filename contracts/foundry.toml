[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
# The deploy script writes contract addresses for keepers and the front-end.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "../deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
]

# Uniswap's PositionManager is only deployed locally in tests. It exceeds the contract size limit unless it is
# built the way Uniswap builds it: through the IR pipeline with 500 optimizer runs.
additional_compiler_profiles = [{ name = "posm", via_ir = true, optimizer_runs = 500 }]
compilation_restrictions = [
    { paths = "lib/v4-periphery/src/PositionManager.sol", via_ir = true, optimizer_runs = 500 },
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

# Heavier fuzzing in CI.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 200

[lint]
# The protocol clock is the block timestamp by design (ERC-6372, weekly locks, seasons,
# authorization windows); second-level drift has no meaningful effect on any of them.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
